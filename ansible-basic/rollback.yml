---
- name: Roll back the deployment
  hosts: all
  become: true
  gather_facts: true
  vars:
    purge: false          # -e purge=true for a full wipe

  tasks:
    - name: Remove the files we deployed
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ web_root }}/index.html"
        - "{{ web_root }}/{{ image_file }}"
        - /var/lib/postgresql/seed
        - "/tmp/{{ image_file }}"

    # ---------------- soft rollback ----------------
    - name: Drop the database
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        state: absent
      when: not purge | bool
      failed_when: false

    - name: Does nginx config exist?
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/default
      register: nginx_cfg

    - name: Restore the stock nginx site on port 80
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              root /var/www/html;
              index index.nginx-debian.html index.html;
              server_name _;
              location / {
                  try_files $uri $uri/ =404;
              }
          }
      when:
        - not purge | bool
        - nginx_cfg.stat.exists
      notify: Restart nginx

    # ---------------- full purge ----------------
    - name: Purge nginx
      ansible.builtin.apt:
        name: [nginx, nginx-common, nginx-core]
        state: absent
        purge: true
        autoremove: true
      when: purge | bool
      failed_when: false

    - name: Purge PostgreSQL
      ansible.builtin.shell: |
        apt-get -y purge 'postgresql*' && apt-get -y autoremove --purge
      args:
        executable: /bin/bash
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: purge | bool
      register: pg_purge
      changed_when: "'Removing' in pg_purge.stdout"
      failed_when: false

    - name: Remove leftover directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/postgresql
        - /etc/postgresql
        - /var/log/postgresql
        - /etc/nginx
        - /var/log/nginx
      when: purge | bool

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
      failed_when: false

- name: Clean the control node
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Remove the fetched image
      ansible.builtin.file:
        path: "/tmp/ansible-{{ image_file }}"
        state: absent
      vars:
        image_file: logo.png

